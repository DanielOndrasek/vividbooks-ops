# Hodinová automatická aktualizace skladových zásob z Fulfillment.cz.
# Vercel Hobby plán nepovoluje hodinové crony, proto plánujeme přes GitHub Actions
# a voláme produkční endpoint GET /api/jobs/sync-inventory (Bearer CRON_SECRET).
#
# VYŽADUJE repository secret CRON_SECRET se stejnou hodnotou jako CRON_SECRET na Vercelu.
# (Bez něj běh skončí chybou "Chybí secret CRON_SECRET".)
# Naplánované běhy jdou jen z větve main. Ručně: Actions → tento workflow → Run workflow.
# Cílovou URL lze přepsat repository variable APP_URL (jinak produkční doména).

name: Sync inventory (hourly)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sync-inventory
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger inventory sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://vividbooks-ops.vercel.app' }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Chybí repository secret CRON_SECRET (Settings → Secrets and variables → Actions). Musí mít stejnou hodnotu jako CRON_SECRET na Vercelu." >&2
            exit 1
          fi

          BASE="${APP_URL:-https://vividbooks-ops.vercel.app}"
          BASE="${BASE%/}"
          echo "Volám ${BASE}/api/jobs/sync-inventory"

          # Sync může kvůli cold startu / delší odpovědi API selhat jednorázově → pár pokusů.
          code=$(curl -sS -m 300 --retry 3 --retry-delay 15 --retry-all-errors \
            -o /tmp/sync.json -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE}/api/jobs/sync-inventory")

          echo "HTTP ${code}"
          cat /tmp/sync.json 2>/dev/null || true
          echo

          if [ "${code}" != "200" ]; then
            echo "::error::Synchronizace skladu selhala (HTTP ${code}). 401 = špatný/chybějící CRON_SECRET (neshoduje se s Vercelem); 502 = chyba API Fulfillment.cz (zkontroluj FULFILLMENT_API_TOKEN)." >&2
            exit 1
          fi

          echo "Synchronizace skladu proběhla úspěšně."
