name: Web unit tests
on:
  pull_request:
    paths: ["apps/web/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Unit tests (bez závislostí, node:test)
        working-directory: apps/web
        run: node --test src/lib/inventory/eshop-prices.test.ts
